# 脱敏模板：使用 scripts/build_configs.py 填入本次 VPS 节点。
# 内置全部 247 条分流规则；住宅可选，最终输出文件名保持 Clash-VPS-住宅.yaml。
# 模板占位符不可直接当作节点导入；不含原部署的 IP、UUID、密钥或订阅令牌。
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: false
profile:
  store-selected: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  fake-ip-filter:
  - +.lan
  - +.local
  - localhost
find-process-mode: always
proxies:
- name: VPS出口 · REALITY Vision
  type: vless
  server: REPLACE_WITH_VPS_IP_OR_DOMAIN
  port: 443
  uuid: REPLACE_WITH_VPS_UUID
  network: tcp
  tls: true
  flow: xtls-rprx-vision
  udp: true
  packet-encoding: xudp
  servername: REPLACE_WITH_VERIFIED_REALITY_SNI
  client-fingerprint: chrome
  reality-opts:
    public-key: REPLACE_WITH_REALITY_PUBLIC_KEY
    short-id: REPLACE_WITH_REALITY_SHORT_ID
    support-x25519mlkem768: true
- name: 住宅出口 · REALITY Vision
  type: vless
  server: REPLACE_WITH_VPS_IP_OR_DOMAIN
  port: 443
  uuid: REPLACE_WITH_RESIDENTIAL_UUID
  network: tcp
  tls: true
  flow: xtls-rprx-vision
  udp: false
  packet-encoding: xudp
  servername: REPLACE_WITH_VERIFIED_REALITY_SNI
  client-fingerprint: chrome
  reality-opts:
    public-key: REPLACE_WITH_REALITY_PUBLIC_KEY
    short-id: REPLACE_WITH_REALITY_SHORT_ID
    support-x25519mlkem768: true
proxy-groups:
- name: PROXY
  type: select
  proxies:
  - VPS出口 · REALITY Vision
  - 住宅出口 · REALITY Vision
  - DIRECT
- name: AI服务
  type: select
  include-all: true
  proxies:
  - PROXY
- name: 流媒体
  type: select
  include-all: true
  proxies:
  - PROXY
- name: 国外网站
  type: select
  include-all: true
  proxies:
  - PROXY
rules:
- PROCESS-PATH-REGEX,^/Applications/Claude[.]app/Contents/.*,AI服务
- PROCESS-NAME-WILDCARD,Claude*,AI服务
- PROCESS-PATH-REGEX,^/Applications/WorkBuddy[.]app/Contents/.*,DIRECT
- PROCESS-PATH-REGEX,^/Users/[^/]+/[.]workbuddy/binaries/.*,DIRECT
- DOMAIN-KEYWORD,deepseek.com,DIRECT
